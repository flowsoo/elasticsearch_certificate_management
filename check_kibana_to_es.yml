---
# ============================================================
# KIBANA → ELASTICSEARCH HTTPS DIAGNOSTIC
#
# Run:
#   ansible-playbook -i inventory.ini check_kibana_to_es.yml
#
# READ ONLY
# ============================================================

- name: Kibana → Elasticsearch HTTPS diagnostic
  hosts: kibana
  become: true
  gather_facts: false

  vars:

    # ========================================================
    # USER VARIABLES
    # ========================================================

    kibana_config: "/etc/kibana/kibana.yml"

    kibana_service: "kibana"

    es_hosts:
      - "es01.example.com"
      - "es02.example.com"
      - "es03.example.com"

    es_http_port: 9200

    certificate_warning_days: 30

    # ========================================================
    # END USER VARIABLES
    # ========================================================


  tasks:

    - name: Header
      ansible.builtin.debug:
        msg:
          - "================================================================"
          - " KIBANA → ELASTICSEARCH HTTPS DIAGNOSTIC"
          - "================================================================"
          - "Kibana node: {{ inventory_hostname }}"
          - ""


    # ========================================================
    # KIBANA CONFIGURATION
    # ========================================================

    - name: Read kibana.yml
      ansible.builtin.slurp:
        src: "{{ kibana_config }}"
      register: kibana_config_raw


    - name: Decode Kibana configuration
      ansible.builtin.set_fact:
        kibana_config_text: "{{ kibana_config_raw.content | b64decode }}"


    - name: Extract Elasticsearch hosts
      ansible.builtin.set_fact:
        configured_es_hosts: >-
          {{
            (
              kibana_config_text
              | regex_findall(
                  '(?m)^\\s*elasticsearch\\.hosts:\\s*(.+)$'
                )
              | first
            ) | default('NOT FOUND', true)
          }}


    - name: Detect Elasticsearch CA configuration
      ansible.builtin.set_fact:
        configured_es_ca: >-
          {{
            (
              kibana_config_text
              | regex_findall(
                '(?m)^\\s*elasticsearch\\.ssl\\.certificateAuthorities:\\s*(.+)$'
              )
              | first
            ) | default('', true)
          }}


    - name: Report Kibana configuration
      ansible.builtin.debug:
        msg:
          - "CONFIGURATION"
          - "----------------------------------------------------------------"
          - "Elasticsearch hosts:"
          - "{{ configured_es_hosts }}"
          - >-
            Elasticsearch CA:
            {{ configured_es_ca if configured_es_ca else 'Not found in expected form' }}
          - ""


    # ========================================================
    # SERVICE
    # ========================================================

    - name: Check Kibana service
      ansible.builtin.command:
        cmd: "systemctl is-active {{ kibana_service }}"
      register: kibana_service_status
      changed_when: false
      failed_when: false


    - name: Report service
      ansible.builtin.debug:
        msg:
          - "IMPLEMENTATION"
          - "----------------------------------------------------------------"
          - >-
            Kibana service:
            {{ 'PASS' if kibana_service_status.rc == 0 else 'FAIL' }}
          - ""


    # ========================================================
    # LIVE TLS FROM KIBANA
    # ========================================================

    - name: Test HTTPS connectivity from Kibana to Elasticsearch
      ansible.builtin.shell: |
        curl \
          --silent \
          --show-error \
          --output /dev/null \
          --write-out '%{http_code}' \
          --connect-timeout 10 \
          "https://{{ item }}:{{ es_http_port }}"
      loop: "{{ es_hosts }}"
      register: es_https_tests
      changed_when: false
      failed_when: false


    - name: Report HTTPS connectivity
      ansible.builtin.debug:
        msg:
          - "LIVE TLS / HTTPS"
          - "----------------------------------------------------------------"
          - >-
            {{ inventory_hostname }} → {{ item.item }}:
            {% if item.rc == 0 %}PASS - HTTP {{ item.stdout }}{% else %}FAIL{% endif %}
      loop: "{{ es_https_tests.results }}"


    # ========================================================
    # CERTIFICATE INFORMATION
    # ========================================================

    - name: Inspect Elasticsearch HTTPS certificate
      ansible.builtin.shell: |
        echo | timeout 10 openssl s_client \
          -connect "{{ item }}:{{ es_http_port }}" \
          -servername "{{ item }}" \
          2>/dev/null |
        openssl x509 \
          -noout \
          -subject \
          -issuer \
          -dates \
          -fingerprint -sha256 \
          -ext subjectAltName
      loop: "{{ es_hosts }}"
      register: es_certificate_info
      changed_when: false
      failed_when: false


    - name: Report Elasticsearch certificates
      ansible.builtin.debug:
        msg:
          - "CERTIFICATE PRESENTED BY {{ item.item }}"
          - "----------------------------------------------------------------"
          - "{{ item.stdout }}"
      loop: "{{ es_certificate_info.results }}"


    # ========================================================
    # FINAL
    # ========================================================

    - name: Final result
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - " RESULT FOR {{ inventory_hostname }}"
          - "================================================================"
          - >-
            Kibana service:
            {{ 'PASS' if kibana_service_status.rc == 0 else 'FAIL' }}
          - "Configuration: see above"
          - "TLS/HTTPS: see individual Elasticsearch results above"
          - "================================================================"
