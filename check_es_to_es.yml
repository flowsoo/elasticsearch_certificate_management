---
# ============================================================
# Elasticsearch ↔ Elasticsearch TLS Diagnostic
#
# RUN FROM:
#   Administration / Ansible machine
#
# COMMAND:
#   ansible-playbook -i inventory.ini check_es_to_es.yml
#
# THIS PLAYBOOK IS READ-ONLY.
# It does NOT modify configuration, certificates or services.
# ============================================================

- name: Elasticsearch ↔ Elasticsearch TLS Diagnostic
  hosts: elasticsearch
  gather_facts: true
  become: true

  vars:

    # ========================================================
    # USER VARIABLES - CHANGE THESE
    # ========================================================

    # Elasticsearch configuration file
    es_config_file: "/etc/elasticsearch/elasticsearch.yml"

    # Elasticsearch service name
    es_service_name: "elasticsearch"

    # Elasticsearch transport port
    es_transport_port: 9300

    # CA certificate used for transport TLS
    es_transport_ca: "/etc/elasticsearch/certs/ca.crt"

    # Transport certificate
    es_transport_cert: "/etc/elasticsearch/certs/transport.crt"

    # Transport private key
    es_transport_key: "/etc/elasticsearch/certs/transport.key"

    # Elasticsearch nodes.
    # Replace hostnames/IPs with your actual values.
    es_nodes:
      - "es01.example.com"
      - "es02.example.com"
      - "es03.example.com"

    # ========================================================
    # END USER VARIABLES
    # ========================================================

  tasks:

    - name: Display node being tested
      debug:
        msg: "Testing Elasticsearch transport TLS on {{ inventory_hostname }}"

    # --------------------------------------------------------
    # SERVICE
    # --------------------------------------------------------

    - name: Check Elasticsearch service
      command: "systemctl is-active {{ es_service_name }}"
      register: es_service
      changed_when: false
      failed_when: false

    - name: Report Elasticsearch service
      debug:
        msg: >-
          [{% if es_service.rc == 0 %}PASS{% else %}FAIL{% endif %}]
          Elasticsearch service is
          {{ 'running' if es_service.rc == 0 else 'NOT running' }}

    # --------------------------------------------------------
    # CONFIGURATION
    # --------------------------------------------------------

    - name: Read Elasticsearch configuration
      slurp:
        src: "{{ es_config_file }}"
      register: es_config
      failed_when: false

    - name: Check transport TLS enabled
      shell: |
        grep -Eiq \
        '^[[:space:]]*xpack\.security\.transport\.ssl\.enabled:[[:space:]]*true' \
        "{{ es_config_file }}"
      register: transport_tls_enabled
      changed_when: false
      failed_when: false

    - name: Report transport TLS configuration
      debug:
        msg: >-
          [{% if transport_tls_enabled.rc == 0 %}PASS{% else %}FAIL{% endif %}]
          xpack.security.transport.ssl.enabled =
          {{ 'true' if transport_tls_enabled.rc == 0 else 'NOT CONFIRMED' }}

    # --------------------------------------------------------
    # CERTIFICATE FILES
    # --------------------------------------------------------

    - name: Check transport CA
      stat:
        path: "{{ es_transport_ca }}"
      register: transport_ca_stat

    - name: Check transport certificate
      stat:
        path: "{{ es_transport_cert }}"
      register: transport_cert_stat

    - name: Check transport private key
      stat:
        path: "{{ es_transport_key }}"
      register: transport_key_stat

    - name: Report certificate files
      debug:
        msg:
          - "[{{ 'PASS' if transport_ca_stat.stat.exists else 'FAIL' }}] CA: {{ es_transport_ca }}"
          - "[{{ 'PASS' if transport_cert_stat.stat.exists else 'FAIL' }}] Certificate: {{ es_transport_cert }}"
          - "[{{ 'PASS' if transport_key_stat.stat.exists else 'FAIL' }}] Private key: {{ es_transport_key }}"

    # --------------------------------------------------------
    # CERTIFICATE VALIDITY
    # --------------------------------------------------------

    - name: Read certificate dates
      command:
        cmd: "openssl x509 -in {{ es_transport_cert }} -noout -dates"
      register: cert_dates
      changed_when: false
      failed_when: false

    - name: Report certificate dates
      debug:
        msg: "{{ cert_dates.stdout if cert_dates.rc == 0 else '[FAIL] Unable to read certificate' }}"

    - name: Check certificate expiration
      shell: |
        openssl x509 \
          -in "{{ es_transport_cert }}" \
          -checkend 0 \
          -noout
      register: cert_expiry
      changed_when: false
      failed_when: false

    - name: Report certificate expiry
      debug:
        msg: >-
          [{% if cert_expiry.rc == 0 %}PASS{% else %}FAIL{% endif %}]
          Transport certificate is
          {{ 'currently valid' if cert_expiry.rc == 0 else 'EXPIRED' }}

    # --------------------------------------------------------
    # CERTIFICATE SAN
    # --------------------------------------------------------

    - name: Read certificate SAN
      command:
        cmd: "openssl x509 -in {{ es_transport_cert }} -noout -ext subjectAltName"
      register: cert_san
      changed_when: false
      failed_when: false

    - name: Display certificate SAN
      debug:
        msg: "{{ cert_san.stdout }}"

    # --------------------------------------------------------
    # PRIVATE KEY MATCH
    # --------------------------------------------------------

    - name: Calculate certificate public key hash
      shell: |
        openssl x509 -in "{{ es_transport_cert }}" -pubkey -noout |
        openssl pkey -pubin -outform DER 2>/dev/null |
        sha256sum
      register: cert_pubkey
      changed_when: false
      failed_when: false

    - name: Calculate private key public key hash
      shell: |
        openssl pkey -in "{{ es_transport_key }}" -pubout 2>/dev/null |
        openssl pkey -pubin -outform DER 2>/dev/null |
        sha256sum
      register: key_pubkey
      changed_when: false
      failed_when: false

    - name: Compare certificate and private key
      debug:
        msg: >-
          [{% if cert_pubkey.stdout.split()[0] == key_pubkey.stdout.split()[0] %}
          PASS{% else %}FAIL{% endif %}]
          Certificate and private key appear to match

    # --------------------------------------------------------
    # PORT
    # --------------------------------------------------------

    - name: Check transport port
      shell: |
        ss -lnt | awk '$4 ~ /:{{ es_transport_port }}$/ {print}'
      register: transport_listener
      changed_when: false
      failed_when: false

    - name: Report transport port
      debug:
        msg: >-
          [{% if transport_listener.stdout != '' %}PASS{% else %}FAIL{% endif %}]
          TCP {{ es_transport_port }}
          {{ 'is listening' if transport_listener.stdout != '' else 'is NOT listening' }}

    # --------------------------------------------------------
    # NODE-TO-NODE TLS TESTS
    # --------------------------------------------------------

    - name: Test TLS connectivity to other Elasticsearch nodes
      shell: |
        timeout 10 openssl s_client \
          -connect "{{ item }}:{{ es_transport_port }}" \
          -CAfile "{{ es_transport_ca }}" \
          -verify_return_error \
          </dev/null 2>&1
      loop: "{{ es_nodes }}"
      when: item != inventory_hostname
      register: node_tls_tests
      changed_when: false
      failed_when: false

    - name: Report node-to-node TLS
      debug:
        msg: >-
          [{% if item.rc == 0 %}PASS{% else %}FAIL{% endif %}]
          {{ inventory_hostname }} → {{ item.item }}:{{ es_transport_port }}
      loop: "{{ node_tls_tests.results }}"

    # --------------------------------------------------------
    # SUMMARY
    # --------------------------------------------------------

    - name: Diagnostic summary
      debug:
        msg:
          - "============================================================"
          - " Elasticsearch Transport TLS Diagnostic"
          - " Node: {{ inventory_hostname }}"
          - "============================================================"
          - "Service:        {{ 'PASS' if es_service.rc == 0 else 'FAIL' }}"
          - "TLS enabled:    {{ 'PASS' if transport_tls_enabled.rc == 0 else 'FAIL' }}"
          - "CA exists:      {{ 'PASS' if transport_ca_stat.stat.exists else 'FAIL' }}"
          - "Certificate:    {{ 'PASS' if transport_cert_stat.stat.exists else 'FAIL' }}"
          - "Private key:    {{ 'PASS' if transport_key_stat.stat.exists else 'FAIL' }}"
          - "Certificate:    {{ 'PASS' if cert_expiry.rc == 0 else 'FAIL / EXPIRED' }}"
          - "Port 9300:      {{ 'PASS' if transport_listener.stdout != '' else 'FAIL' }}"
          - "============================================================"
