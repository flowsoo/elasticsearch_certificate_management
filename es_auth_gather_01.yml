          - "{{ kibana_certificate_details.stdout | default('Not available') }}"
          - ""
          - "KIBANA LISTENER:"
          - "{{ kibana_listener.stdout | default('Not available') }}"
          - ""
          - "================================================================"
      when: is_kibana_host


    # ================================================================
    # DISPLAY LOGSTASH INFORMATION
    # ================================================================

    - name: Display Logstash information
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - " LOGSTASH INFORMATION - {{ inventory_hostname }}"
          - "================================================================"
          - ""
          - "VERSION:"
          - "{{ logstash_version.stdout | default('Not a Logstash host') }}"
          - ""
