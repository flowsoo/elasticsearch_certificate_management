          - "{{ es_transport_listener.stdout | default('Not available') }}"
          - ""
          - "================================================================"
      when: is_elasticsearch_host


    # ================================================================
    # DISPLAY KIBANA INFORMATION
    # ================================================================

    - name: Display Kibana information
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - " KIBANA INFORMATION - {{ inventory_hostname }}"
          - "================================================================"
          - ""
          - "VERSION:"
          - "{{ kibana_version.stdout | default('Not a Kibana host') }}"
          - ""
          - "SYSTEMD:"
          - "{{ kibana_systemd.stdout | default('Not a Kibana host') }}"
          - ""
          - "ELASTICSEARCH CONNECTION CONFIGURATION:"
          - "{{ kibana_es_config.stdout | default('Not available') }}"
          - ""
          - "KIBANA SERVER CONFIGURATION:"
          - "{{ kibana_server_config.stdout | default('Not available') }}"
          - ""
