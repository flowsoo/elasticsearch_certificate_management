          - "{{ kibana_auth_config.stdout | default('Not available') }}"
          - ""
          - "KIBANA KEYSTORE - SETTING NAMES ONLY:"
          - "{{ kibana_keystore_names.stdout | default('Not available') }}"
          - ""
          - "TLS FILES:"
          - "{{ kibana_tls_files.stdout | default('Not available') }}"
          - ""
