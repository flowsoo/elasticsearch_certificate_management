          - ""
          - "NETWORK / HTTP / TRANSPORT / TLS CONFIGURATION:"
          - "{{ es_network_tls_config.stdout | default('Not an Elasticsearch host') }}"
          - ""
          - "SECURITY CONFIGURATION:"
          - "{{ es_security_config.stdout | default('Not an Elasticsearch host') }}"
          - ""
          - "CLUSTER / DISCOVERY:"
          - "{{ es_cluster_config.stdout | default('Not an Elasticsearch host') }}"
          - ""
          - "ELASTICSEARCH KEYSTORE - SETTING NAMES ONLY:"
          - "{{ es_keystore_names.stdout | default('Not available') }}"
          - ""
          - "TLS FILES:"
          - "{{ es_tls_files.stdout | default('Not available') }}"
          - ""
          - "CERTIFICATE REFERENCES:"
          - "{{ es_certificate_references.stdout | default('Not available') }}"
          - ""
          - "CERTIFICATE DETAILS:"
          - "{{ es_certificate_details.stdout | default('Not available') }}"
          - ""
