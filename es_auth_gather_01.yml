          - "{{ logstash_systemd.stdout | default('Not a Logstash host') }}"
          - ""
          - "MAIN CONFIGURATION:"
          - "{{ logstash_main_config.stdout | default('Not available') }}"
          - ""
          - "PIPELINE CONFIGURATION:"
          - "{{ logstash_pipeline_config.stdout | default('Not available') }}"
          - ""
          - "ELASTICSEARCH / TLS CONFIGURATION:"
          - "{{ logstash_tls_config.stdout | default('Not available') }}"
          - ""
          - "LOGSTASH KEYSTORE - SETTING NAMES ONLY:"
          - "{{ logstash_keystore_names.stdout | default('Not available') }}"
          - ""
          - "TLS FILES:"
          - "{{ logstash_tls_files.stdout | default('Not available') }}"
          - ""
          - "CERTIFICATE DETAILS:"
